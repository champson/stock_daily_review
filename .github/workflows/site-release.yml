name: Verify and package Site

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    name: Verify and package Site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked JavaScript dependencies
        run: npm run install:ci

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify, build and package the exact revision
        run: node scripts/prepare-site-release.mjs --output "$RUNNER_TEMP/site-release.tar"

      - name: Save the verified release artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: site-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/site-release.tar
            ${{ runner.temp }}/release.json
          if-no-files-found: error
          retention-days: 14
